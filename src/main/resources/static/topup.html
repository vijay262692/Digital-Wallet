<!DOCTYPE html>
<html>
<head>
<title>Top Up Wallet</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#007bff,#00c6ff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    width:420px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,0.25);
}

h2{
    margin-bottom:25px;
    font-size:36px;
}

.balance{
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    margin-bottom:15px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#00b4db,#0072ff);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#result{
    margin-top:15px;
    font-weight:bold;
    font-size:16px;
}
</style>

</head>

<body>

<div class="container">

    <h2>💰 Top Up Wallet</h2>

    <div class="balance">
        Wallet Balance: ₹<span id="balance">0</span>
    </div>

    <input
        type="number"
        id="amount"
        placeholder="Enter amount to top up">

    <button onclick="topUp()">
        Top Up Wallet
    </button>

    <p id="result"></p>

</div>

<script>

function loadBalance(){
    const username = localStorage.getItem("loggedInUser");

    fetch("/api/wallet/balance/" + username)
    .then(res => res.json())
    .then(data => {
        document.getElementById("balance").innerText =
            data.walletBalance || 0;
    });
}

function topUp(){

    const username = localStorage.getItem("loggedInUser");
    const amount = document.getElementById("amount").value;

    fetch("/api/wallet/topup",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            username:username,
            amount:amount
        })
    })
    .then(res=>res.text())
    .then(data=>{
        document.getElementById("result").innerHTML =
            "✅ " + data;

        loadBalance();
        document.getElementById("amount").value="";
    });
}

loadBalance();

</script>

</body>
</html>
